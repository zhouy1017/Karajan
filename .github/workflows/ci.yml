name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"
  UV_PYTHON: "3.12"

jobs:
  python-quality:
    name: python-quality (${{ matrix.os }}, Python 3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up the pinned uv version
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.10"
          enable-cache: false

      - name: Check the dependency lock
        run: uv lock --check

      - name: Install locked development dependencies
        run: uv sync --frozen --extra dev

      - name: Set up pinned Node.js for the runtime probe
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"

      - name: Install the locked OpenCode runtime
        run: npm ci --prefix runtimes/opencode --no-audit --no-fund

      - name: Permit required namespaces on the ephemeral Linux test runner
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Lint Python
        run: uv run --frozen --extra dev ruff check .

      - name: Check backend types
        run: uv run --frozen --extra dev mypy backend/karajan

      - name: Run tests, including contract tests
        run: uv run --frozen --extra dev pytest tests
        env:
          KARAJAN_REQUIRE_OPENCODE_ISOLATION: "1"

      - name: Check Go diagnostic boundaries without provider credentials
        run: >-
          uv run --frozen --extra dev pytest
          examples/opencode-go-live/spec/test_public_probe.py
          examples/opencode-go-live/standards/independent_cases.py

      - name: Check approved-routing public boundaries without provider credentials
        run: >-
          uv run --frozen --extra dev pytest
          -o "pythonpath=backend tests/web tests/runs"
          examples/approved-routing/qualification/spec/test_public_qualification.py
          examples/approved-routing/demand/spec/test_public_demand.py
          examples/approved-routing/routing/spec/test_public_assessment.py
          examples/approved-routing/capacity/standards/test_capacity_standards.py
          examples/approved-routing/routing/standards/test_routing_standards.py

      - name: Check durable task admission and recovery without provider credentials
        run: >-
          uv run --frozen --extra dev pytest
          -o "pythonpath=backend tests/runs tests/web"
          examples/task-admission/spec
          examples/task-admission/standards

      - name: Check isolated Go runtime independent boundaries without provider credentials
        run: >-
          uv run --frozen --extra dev pytest
          -o "pythonpath=backend tests/adapters/opencode tests/isolation"
          examples/opencode-go-isolated-journal
          examples/opencode-go-isolated-relay
          examples/opencode-go-isolated-observer
          examples/opencode-go-isolated-namespace
        env:
          KARAJAN_REQUIRE_OPENCODE_ISOLATION: "1"
          KARAJAN_OPENCODE_LINUX_BINARY: runtimes/opencode/node_modules/opencode-linux-x64/bin/opencode

      - name: Check persistent Go qualification independent boundaries without credentials
        run: >-
          uv run --frozen --extra dev pytest
          -o "pythonpath=backend tests/projects tests/isolation"
          examples/go-profile-qualification-spec
          examples/go-profile-standards
          examples/go-suite-independent-review
          examples/go-profile-cli-spec
        env:
          KARAJAN_REQUIRE_OPENCODE_ISOLATION: "1"
          KARAJAN_OPENCODE_LINUX_BINARY: runtimes/opencode/node_modules/opencode-linux-x64/bin/opencode

  frontend-quality:
    name: frontend-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.1"

      - name: Install the locked frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Check frontend types
        run: npm run typecheck

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend interaction tests
        run: npm test

      - name: Build the production workbench
        run: npm run build

  quality-gate:
    name: quality-gate
    if: ${{ always() }}
    needs: [python-quality, frontend-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every upstream check to succeed
        shell: bash
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          results = json.loads(os.environ["NEEDS_RESULTS"])
          required = {"python-quality", "frontend-quality"}
          if set(results) != required:
              print("Required checks are missing or the gate dependency list is inconsistent.")
              sys.exit(1)
          unsuccessful = {
              job: outcome.get("result", "missing")
              for job, outcome in results.items()
              if outcome.get("result") != "success"
          }
          if unsuccessful:
              print(f"Required checks did not succeed: {unsuccessful}")
              sys.exit(1)
          print("All required checks succeeded.")
          PY
